      scarf: "深紅色（暗酒紅）粗針織圍巾繞頸自然垂落（畫面核心低飽和暖色視覺錨點）"
    forbidden_in_anchor: ["灰底細條紋西裝外套", "現代科幻緊身衣", "無紅圍巾", "淺色外套"]
    qc_gate_key: costume_4pt
    prompt_zh_positive: "穿素面黑色羊毛大衣，頸圍深紅色粗針織圍巾"

  - anchor_id: ANC-SYS01-03
    name: 全息投影光學五要素（AMD-05 v3）
    category: projection_optics
    applies_to_eras: ["2022", "2026"]
    required_prompt_terms_min: 2
    canonical_prompt_terms_zh:
      - "全息投影"
      - "半透明"
      - "掃描線"
      - "藍色輪廓光"
      - "粒子消散"
      - "下身光塵化"
    spec:
      optics_5pt:
        - "半透明軀幹（非實心肉身站立）"
        - "水平細密藍色掃描線集中於肩衣與軀幹（臉部極淡豁免）"
        - "柔和冰藍色輪廓光包覆髮絲與肩線"
        - "下身可自然粒子消散，但消散點必落於地面附近（與范蠡同一地平面，嚴禁半空懸浮漂浮）"
        - "對現場地面／霧氣與范蠡臉側／衣領自然回打柔和冷青微光（爆光 <5%）"
    forbidden_in_anchor: ["實心真人站立", "半空懸浮漂浮", "粗糙白邊去背貼紙", "矩形軟體視窗外框", "音訊波形條", "過曝閃白"]
    qc_gate_key: light_lock
    prompt_zh_positive: "半透明全息投影，平視站位於范蠡面前同一地平面，冰藍色輪廓光，水平細密藍色掃描線覆於肩衣（臉部極淡），下身於地面附近自然粒子消散（非半空懸浮），柔和冷青光映照范蠡臉側"

  - anchor_id: ANC-SYS01-04
    name: V9 零文字／零浮動面板／零圓形 HUD 光環（一票否決）
    category: hard_ban_v9
    applies_to_eras: ["2022", "2026"]
    auto_fail_on_single_frame: true
    forbidden_in_anchor:
      - "任何漢字／英文字母／數字／偽文字"
      - "浮動小面板／懸浮數據視窗"
      - "圓形雷達光環／HUD介面框"
      - "豆包／品牌標誌／任務啟動字樣"
    qc_gate_key: pose_spatial
    prompt_zh_avoid: "任何文字、漢字、英文字母、數字、浮動小面板、懸浮數據視窗、圓形雷達光環、HUD介面框、品牌標誌、浮水印、音訊波形條"

  - anchor_id: ANC-SYS01-05
    name: 平視面前單一預設尺度、剪輯切入顯現語法與微表情可讀性（sys01_scale_mode / sys01_apparition_mode）
    category: scale_and_expression
    default_scale_mode: eye_level_in_front
    default_apparition_mode: editorial_cut_in
    retired_scale_modes: ["manifestation_hero"]
    pre_shot_cue_triple:
      - "范蠡臉側冷青光閃（light cue）"
      - "環境聲抽空（sound_drop -38 dBFS / 0.35s）"
      - "范蠡眼平視線轉向正前方預定位（eyeline shift）"
    variants:
      eye_level_in_front:
        applies_to_scale_modes: ["eye_level_in_front", "conversation_eyeline"]
        spec: "平視構圖（眼平 ±5°）、尺度 0.90–1.00×（與范蠡同高）；站位在范蠡面前、與他同一地平面；半透明、下身粒子消散點落於地面附近（絕非懸空漂浮）；入場採前鏡三要素預告後剪輯硬切入已成場（editorial_cut_in），鏡內光凝僅作偶爾點綴。適用全線雙人顯現與對話鏡，含 2022 初現 S03/S04a、DEMO-03 S3b、EP-01 S08/S10（S08 預留暗區給後製無框側卡）"
        forbidden_in_variant: ["半空懸浮漂浮", "仰視英雄尺度(1.25-1.45x)", "巨人壓頂", "同場無故縮放 >±10%"]
      solo_cu:
        applies_to_scale_modes: ["solo_cu"]
        spec: "85mm 平視正面胸上特寫；S19 必於 360px 手機縮圖下清晰辨識 R1C1 禮貌微笑 → R1C5 半秒嘴角微收 1–2mm 凝滯遲疑"
        forbidden_in_variant: ["掃描線遮蓋眼唇", "過度悲傷皺眉流淚", "大轉頭", "仰視低角度"]
    qc_gate_key: expression_lip
